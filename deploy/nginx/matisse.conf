# CB-MDTM — nginx site config (Ankara prod)
# =========================================
# Kurulum:
#   sudo cp /opt/matisse/deploy/nginx/matisse.conf /etc/nginx/sites-available/matisse
#   sudo ln -sf /etc/nginx/sites-available/matisse /etc/nginx/sites-enabled/matisse
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# PATH ROUTING:
#   /         -> frontend static (Vite build, /var/www/matisse)
#   /api/*    -> FastAPI          (127.0.0.1:8000)
#   /auth/*   -> Keycloak         (127.0.0.1:8080)
#   /stream/* -> Unreal signaling (127.0.0.1:8888) [Faz 3, simdilik yorumlu]
# Tek origin oldugu icin CORS onemsizlesir.
#
# ═══ TLS ZORUNLUDUR — ERTELENEBILIR BIR SERTLESTIRME DEGIL ═══
# PKCE akisi code challenge uretmek icin tarayici Web Crypto API'sini
# gerektirir; bu API YALNIZCA guvenli baglamda (HTTPS veya loopback)
# kullanilabilir. Duz HTTP + IP uzerinde Keycloak init "Web Crypto API is
# not available" ile patlar ve HIC KIMSE giris yapamaz. (30 Tem'de yasandi.)
#
# ═══ IKI SERTIFIKA SENARYOSU ═══
# A) SELF-SIGNED  — su an AKTIF. LAN'da HTTPS saglar, tarayici uyari verir.
#      sudo mkdir -p /etc/nginx/ssl
#      sudo openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
#        -keyout /etc/nginx/ssl/matisse.key -out /etc/nginx/ssl/matisse.crt \
#        -subj "/C=TR/ST=Ankara/L=Ankara/O=DEFTR/CN=192.168.1.73" \
#        -addext "subjectAltName=IP:192.168.1.73,DNS:matisse.deftr.com,DNS:DEFTR-MATISSE"
#      sudo chmod 600 /etc/nginx/ssl/matisse.key
#
# B) LET'S ENCRYPT — DEFTR IT public DNS + 443 yonlendirmesini acinca.
#      sudo apt install -y certbot python3-certbot-nginx
#      sudo certbot --nginx -d matisse.deftr.com
#    certbot sertifika yollarini kendisi yazar. Elle gecis icin: asagidaki
#    ssl_certificate / ssl_certificate_key satirlarini (A) yerine (B) yap.
#
# NOT: nginx 1.18 (Ubuntu 22.04) "http2 on;" ayri direktifini TANIMAZ.
#      Dogru sozdizimi: listen 443 ssl http2;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # ── (A) SELF-SIGNED — AKTIF ────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/matisse.crt;
    ssl_certificate_key /etc/nginx/ssl/matisse.key;

    # ── (B) LET'S ENCRYPT — DNS hazir olunca (A) yerine bunlari ac ─────
    # ssl_certificate     /etc/letsencrypt/live/matisse.deftr.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/matisse.deftr.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # add_header Strict-Transport-Security "max-age=31536000" always;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # LAN IP + hostname + (DNS gelince) domain
    server_name 192.168.1.73 matisse.deftr.com DEFTR-MATISSE _;

    client_max_body_size 32m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/matisse.access.log;
    error_log  /var/log/nginx/matisse.error.log;

    # ─── Frontend (Vite build) ───────────────────────────────────────────
    root /var/www/matisse;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── FastAPI ─────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # ─── SSE canli akis ──────────────────────────────────────────────────
    # KRITIK: SSE uzun omurlu baglantidir. Buffering ACIK kalirsa nginx
    # event'leri biriktirir ve tarayiciya hic ulasmaz — akis "calisiyor ama
    # ekran hareket etmiyor" gibi gorunur.
    location /api/v1/stream/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;

        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # ─── Keycloak ────────────────────────────────────────────────────────
    # Keycloak KC_HTTP_RELATIVE_PATH=/auth ile calisiyor, yani kendi
    # URL'lerini /auth ile uretiyor. Bu yuzden proxy_pass'te path YENIDEN
    # yazilmamali (sonunda / YOK).
    location /auth/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_buffer_size   16k;
        proxy_busy_buffers_size 32k;
        proxy_buffers       8 16k;
    }

    # ─── Unreal Pixel Streaming signaling (Faz 3) ────────────────────────
    # WebSocket upgrade gerektirir. Signaling server ayaga kalkinca ac.
    #
    # location /stream/ {
    #     proxy_pass http://127.0.0.1:8888/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade    $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host       $host;
    #     proxy_read_timeout 24h;
    # }
}

# ─── HTTP → HTTPS yonlendirmesi ──────────────────────────────────────────
# Let's Encrypt HTTP-01 dogrulamasi icin 80 acik kalmali.
server {
    listen 80;
    listen [::]:80;
    server_name 192.168.1.73 matisse.deftr.com DEFTR-MATISSE _;

    # certbot webroot dogrulamasi (gerekirse)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
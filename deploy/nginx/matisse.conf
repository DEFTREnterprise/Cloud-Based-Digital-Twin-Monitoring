# CB-MDTM — nginx site config (Ankara prod)
# =========================================
# Kurulum:
#   sudo cp /opt/matisse/deploy/nginx/matisse.conf /etc/nginx/sites-available/matisse
#   sudo ln -sf /etc/nginx/sites-available/matisse /etc/nginx/sites-enabled/matisse
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# PATH ROUTING (AI_CONTEXT §1):
#   /         -> frontend static (Vite build, /var/www/matisse)
#   /api/*    -> FastAPI          (127.0.0.1:8000)
#   /auth/*   -> Keycloak         (127.0.0.1:8080)
#   /stream/* -> Unreal signaling (127.0.0.1:8888) [Faz 3, simdilik yorumlu]
#
# Tek origin oldugu icin CORS onemsizlesir.
#
# ═══ TLS DURUMU ═══
# Su an HTTP-only. DEFTR IT'den DNS (matisse.deftr.com A kaydi) + 443
# yonlendirmesi geldiginde:
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d matisse.deftr.com
# certbot bu dosyayi otomatik duzenler ve 443 bloguyla HTTP->HTTPS
# yonlendirmesini kendisi ekler. Asagidaki yorumlu blok referans amaclidir.

server {
    listen 80;
    listen [::]:80;

    # TODO(deploy): DNS hazir olunca 'matisse.deftr.com' yaz.
    # Simdilik LAN IP ve hostname ile calisiyor.
    server_name _;

    # Yukleme boyutu (ileride MinIO/dosya yukleme icin)
    client_max_body_size 32m;

    # Guvenlik basliklari (TLS'siz de anlamli olanlar)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/matisse.access.log;
    error_log  /var/log/nginx/matisse.error.log;

    # ─── Frontend (Vite build) ───────────────────────────────────────────
    root /var/www/matisse;
    index index.html;

    location / {
        # SPA: bilinmeyen yollar index.html'e duser (client-side routing yok
        # ama yine de dogru davranis)
        try_files $uri $uri/ /index.html;
    }

    # Hash'li asset'ler uzun cache'lenebilir (Vite dosya adina hash koyar)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── FastAPI ─────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # /health (auth'suz saglik ucu) — API prefix'i disinda
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # ─── SSE canli akis ──────────────────────────────────────────────────
    # KRITIK: SSE uzun omurlu bir baglantidir. Buffering ACIK kalirsa
    # nginx event'leri biriktirir ve tarayiciya hic ulasmaz — akis
    # "calisiyor ama ekran hareket etmiyor" gibi gorunur.
    location /api/v1/stream/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;

        # SSE saatlerce acik kalir
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # ─── Keycloak ────────────────────────────────────────────────────────
    # Keycloak KC_HTTP_RELATIVE_PATH=/auth ile calisiyor, yani kendi
    # URL'lerini /auth ile uretiyor. Bu yuzden proxy_pass'te path YENIDEN
    # yazilmamali (sonunda / YOK).
    location /auth/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_buffer_size   16k;
        proxy_busy_buffers_size 32k;
        proxy_buffers       8 16k;
    }

    # ─── Unreal Pixel Streaming signaling (Faz 3) ────────────────────────
    # WebSocket upgrade gerektirir. Signaling server ayaga kalkinca ac.
    #
    # location /stream/ {
    #     proxy_pass http://127.0.0.1:8888/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade    $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host       $host;
    #     proxy_read_timeout 24h;
    # }
}


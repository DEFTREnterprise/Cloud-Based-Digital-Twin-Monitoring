# CB-MDTM — Mosquitto (Ankara prod)
# =================================
# Broker Docker icinde calisir ve YALNIZCA 127.0.0.1:1883'e bind edilir
# (bkz. docker-compose.yml ports). Yani anonim erisim disaridan mumkun degil;
# sadece ayni makinedeki bridge ve worker baglanabilir.
#
# Faz 3'te 8883 (MQTT/TLS) + kullanici/parola acilacak (UFW'de port zaten hazir).
# O zaman allow_anonymous false + password_file eklenecek.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# QoS-1 mesajlari icin kuyruk (worker kisa sureli dusarse kayip olmasin)
max_queued_messages 10000
